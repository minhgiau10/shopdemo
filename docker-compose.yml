services:
  api-gateway:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    container_name: shopdemo-api-gateway
    restart: unless-stopped
    env_file:
      - ./apps/api-gateway/.env
    environment:
      PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      INVENTORY_SERVICE_URL: http://inventory-service:3004
      ORDER_SERVICE_URL: http://order-service:3005
      PAYMENT_SERVICE_URL: http://payment-service:3006
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - inventory-service
      - order-service
      - payment-service

  auth-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: shopdemo-auth-service
    restart: unless-stopped
    env_file:
      - ./apps/auth-service/.env
    expose:
      - "3001"

  product-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: product-service
    container_name: shopdemo-product-service
    restart: unless-stopped
    env_file:
      - ./apps/product-service/.env
    expose:
      - "3002"

  cart-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: cart-service
    container_name: shopdemo-cart-service
    restart: unless-stopped
    env_file:
      - ./apps/cart-service/.env
    expose:
      - "3003"

  inventory-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: inventory-service
    container_name: shopdemo-inventory-service
    restart: unless-stopped
    env_file:
      - ./apps/inventory-service/.env
    expose:
      - "3004"

  order-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: order-service
    container_name: shopdemo-order-service
    restart: unless-stopped
    env_file:
      - ./apps/order-service/.env
    expose:
      - "3005"

  payment-service:
    build:
      context: ./apps
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: payment-service
    container_name: shopdemo-payment-service
    restart: unless-stopped
    env_file:
      - ./apps/payment-service/.env
    expose:
      - "3006"

  user-interface:
    build:
      context: ./frontend/user-interface
      dockerfile: Dockerfile
    container_name: shopdemo-user-interface
    restart: unless-stopped
    env_file:
      - ./frontend/user-interface/.env
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway